name: Update App Shelf

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-apps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-apps.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet apps.json || \
            git commit -am "chore: update apps.json [skip ci]"

      - name: Push
        run: git push
